name: Test, build WebAssembly, deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust compiler and WebAssembly target
        run: rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown
      - name: Build dependency-free module and site
        run: sh build.sh
      - name: Test native logic and actual WebAssembly
        run: sh test.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
